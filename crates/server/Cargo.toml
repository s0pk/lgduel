[package]
name = "lgduel-server"
description = "LGDuel headless dedicated server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
lgduel-sim = { path = "../sim" }
lgduel-net = { path = "../net" }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

[dev-dependencies]
lgduel-bot = { path = "../bot" }

[lib]
name = "lgduel_server"
path = "src/lib.rs"

[[bin]]
name = "lgduel-server"
path = "src/main.rs"
