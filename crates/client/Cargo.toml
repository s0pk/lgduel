[package]
name = "lgduel-client"
description = "LGDuel client: renderer, input, UI"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
lgduel-sim = { path = "../sim" }
lgduel-net = { path = "../net" }
lgduel-bot = { path = "../bot" }
lgduel-server = { path = "../server" }
wgpu = "30.0.1"
winit = "0.30.13"
pollster = "1.0.1"
glam = "0.34.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
png = "0.18.1"
cpal = "0.18.2"
egui = "0.37"
egui-wgpu = "0.37"
egui-winit = "0.37"

[[bin]]
name = "lgduel"
path = "src/main.rs"

[dev-dependencies]
skrifa = "0.44"
