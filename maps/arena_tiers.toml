# ramp onto the mid deck (run 256 → ~20.6°)
[[ramp]]
min = [0.0, -160.0, 0.0]
max = [256.0, 160.0, 96.0]
rise = "+x"
color = [0.48, 0.51, 0.58]

# stairs onto the mid deck (6 × 16u)
[[stairs]]
min = [64.0, 560.0, 0.0]
max = [256.0, 752.0, 96.0]
rise = "+x"
steps = 6
color = [0.48, 0.51, 0.58]

# high deck (south-east, 192 up)
[[brush]]
min = [704.0, -1024.0, 96.0]
max = [1024.0, -448.0, 192.0]
color = [0.46, 0.42, 0.50]

# ramp from the mid deck to the high deck (run 224 → ~23°)
[[ramp]]
min = [480.0, -800.0, 96.0]
max = [704.0, -608.0, 192.0]
rise = "+x"
color = [0.52, 0.48, 0.56]

