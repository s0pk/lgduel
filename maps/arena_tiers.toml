# arena_tiers — three levels: ground (west), a mid deck 96 up (east) reached by a ramp and stairs,
# and a high deck 192 up in the south-east corner reached by a ramp from the mid deck.
# Original map, CC0. Units: Quake units; floor top z = 0.

name = "arena_tiers"
default_color = [0.55, 0.55, 0.58]

# ground floor
[[brush]]
min = [-1024.0, -1024.0, -32.0]
max = [1024.0, 1024.0, 0.0]
color = [0.35, 0.36, 0.40]

# walls and ceiling
[[brush]]
min = [1024.0, -1056.0, -32.0]
max = [1056.0, 1056.0, 1024.0]
[[brush]]
min = [-1056.0, -1056.0, -32.0]
max = [-1024.0, 1056.0, 1024.0]
[[brush]]
min = [-1024.0, 1024.0, -32.0]
max = [1024.0, 1056.0, 1024.0]
[[brush]]
