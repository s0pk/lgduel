[workspace]
resolver = "3"
members = ["crates/sim", "crates/net", "crates/server", "crates/client", "crates/bot", "crates/tools"]

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Release build with debug info: what check.sh builds and tests.
[profile.release-dbg]
inherits = "release"
debug = true

# Release packages: whole-program optimisation and no symbols (smaller, slower to build).
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
