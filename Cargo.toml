[workspace]
resolver = "3"
members = ["crates/sim", "crates/net", "crates/server", "crates/client", "crates/bot", "crates/tools"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Release build with debug info: what check.sh builds and tests.
[profile.release-dbg]
inherits = "release"
debug = true
