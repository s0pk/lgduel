name: Release

# Push a tag like v0.2.0 to build both platforms and publish a GitHub release
# with LGDuel-windows-x64.zip and lgduel-server-linux-x64.tar.gz attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build and zip
        run: |
          cargo build --profile dist -p lgduel-client -p lgduel-server -p lgduel-bot
          OUT=dist/LGDuel-windows-x64
          mkdir -p "$OUT"
          cp target/dist/lgduel.exe target/dist/lgduel-server.exe target/dist/lgduel-bot.exe "$OUT/"
          cp PLAY.md README.md HOSTING.md DEPLOY.md CONFIG.md MAPS.md LICENSE config/server.example.toml "$OUT/"
          echo "${GITHUB_REF_NAME} ($(git rev-parse --short HEAD))" > "$OUT/VERSION.txt"
          cd dist && 7z a -tzip LGDuel-windows-x64.zip LGDuel-windows-x64 >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/LGDuel-windows-x64.zip

  linux-server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build and pack the dedicated server
        run: |
          cargo build --profile dist -p lgduel-server -p lgduel-bot
          OUT=dist/lgduel-server-linux-x64
          mkdir -p "$OUT"
          cp target/dist/lgduel-server target/dist/lgduel-bot "$OUT/"
          cp DEPLOY.md LICENSE config/server.example.toml deploy/lgduel-server.service deploy/lgduel-relay.service "$OUT/"
          echo "${GITHUB_REF_NAME} ($(git rev-parse --short HEAD))" > "$OUT/VERSION.txt"
          tar -C dist -czf dist/lgduel-server-linux-x64.tar.gz lgduel-server-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-server
          path: dist/lgduel-server-linux-x64.tar.gz

  publish:
    needs: [windows, linux-server]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "LGDuel $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
